[project]
name = "trysac-license-auditor"
dynamic = ["version"]
description = "Audit dependency licenses against an allowlist policy with SPDX license expressions, PEP 639 metadata and conservative classifier mapping"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miguel Gomez" }]
keywords = ["license-auditor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Trysac/u068-license-auditor"
Source = "https://github.com/Trysac/u068-license-auditor"
Issues = "https://github.com/Trysac/u068-license-auditor/issues"
Changelog = "https://github.com/Trysac/u068-license-auditor/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/license_auditor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/license_auditor"]

[tool.hatch.build.targets.sdist]
# Ship the library, its tests and its docs; never the factory's internal files.
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["license_auditor"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
